# Release with OIDC
# https://github.blog/changelog/2025-07-31-npm-trusted-publishing-with-oidc-is-generally-available/
# https://docs.npmjs.com/trusted-publishers

name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # enable pushing changes to the origin
  id-token: write # enable generation of an ID token for publishing
  pull-requests: write # enable opening a PR for the release

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: corepack enable

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      # `changeset publish` shells out to npm, and OIDC trusted publishing
      # needs npm >= 11.5.1. The Node release pinned in .nvmrc currently bundles
      # a newer npm, so no global install is needed — but assert it here instead
      # of discovering it at publish time, in case .nvmrc is ever lowered.
      - name: Assert npm supports trusted publishing
        run: |
          required=11.5.1
          actual=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is too old for OIDC trusted publishing (need >= $required)" >&2
            exit 1
          fi

      - run: yarn install --immutable --mode=skip-build

      - name: Create Release PR or Publish to npm
        uses: changesets/action@v1.9.0
        with:
          publish: yarn release
          commit: 'chore: update version for release'
          title: 'chore: update version for release'
        env:
          # Ephemeral GITHUB_TOKEN won't be able to trigger actions on release PR
          # RELEASE_TOKEN can trigger actions on new PR's but seems not to be able to do so on force-pushed PR's.
          # To publish the PR created by Changesets, the action must first be closed and then
          # manually retriggered by running the "Release / Version or Publish" action on the master branch.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
